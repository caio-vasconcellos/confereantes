[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confereantes"
version = "1.3.0"
description = "Local checks for warning signs in messages, links and Pix payment requests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1.0",
  "cryptography>=46,<51",
  "fastapi>=0.115,<1.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.12,<1.0",
  "starlette>=0.46,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
ocr = [
  "onnxruntime>=1.31,<2.0",
  "Pillow>=12,<14",
  "rapidocr>=3.10,<4.0",
  "zxing-cpp>=3.0,<4.0",
]
dev = [
  "pytest>=8.3,<10.0",
  "httpx>=0.28,<1.0",
  "Pillow>=12,<14",
  "zxing-cpp>=3.0,<4.0",
  "qrcode>=8,<9",
]

[project.scripts]
confereantes = "confereantes.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
confereantes = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

